syntax = "proto3";
package anet.credentials.v1;
option go_package = "github.com/agentnet/agentnet/proto/gen/anet/credentials/v1;credentialsv1";
import "google/protobuf/timestamp.proto";

// Current instance only. No owner/agent/instance identity comes from the body.
service InstanceCredentials {
 rpc GetStatus(GetStatusRequest) returns (CredentialStatus);
 rpc PrepareRenewal(PrepareRenewalRequest) returns (PreparedCredential);
 // Authenticates with the newly prepared key. A pending certificate is accepted
 // only for this exact method, never as a general worker credential.
 rpc ActivateRenewal(ActivateRenewalRequest) returns (CredentialStatus);
 // Current credential only; never discards an already activated key.
 rpc AbandonRenewal(AbandonRenewalRequest) returns (CredentialStatus);
}
message GetStatusRequest {}
message CredentialStatus {
 string instance_id = 1;
 int64 version = 2;
 string fingerprint = 3;
 google.protobuf.Timestamp expires_at = 4;
}
message PrepareRenewalRequest {
 string request_id = 1;
 int64 expected_version = 2;
 bytes csr_pem = 3;
}
message PreparedCredential {
 string instance_id = 1;
 int64 version = 2;
 bytes certificate_pem = 3;
 google.protobuf.Timestamp activate_before = 4;
}
message ActivateRenewalRequest { string request_id = 1; }
message AbandonRenewalRequest { string request_id = 1; int64 expected_version = 2; }
